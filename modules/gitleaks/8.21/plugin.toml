name = "gitleaks"
version = "8.21"
sha256 = "9f1e00000000000000000000000000000000000000000000000000000000b203"
exports = ["scan_repo", "scan_diff"]

[runtime]
wasmtime = "24"
fuel_cap = 5000000000
epoch_interrupt_ms = 10
memory_cap_mb = 256

[capabilities]
imports = [
  "wasi:filesystem/preopens",
  "wasi:io/streams",
  "wasi:cli/stdout",
  "wasi:cli/stderr",
  "wasi:cli/stdin",
  "wasi:cli/arguments",
  "wasi:cli/environment",
  "wasi:cli/exit",
  "wasi:clocks/monotonic-clock",
  "wasi:random/random"
]
filesystem = "read-only"
preopen = "/workspace"
sockets = "denied"
wall_clock = "denied"
