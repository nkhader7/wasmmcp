name    = "tree-sitter"
version = "0.22"
sha256  = "5c2d000000000000000000000000000000000000000000000000000000f347bb"
exports = ["parse_ast"]

[runtime]
wasmtime           = "24"
fuel_cap           = 5000000000
epoch_interrupt_ms = 10
memory_cap_mb      = 256

[capabilities]
imports = [
  "wasi:filesystem/preopens",
  "wasi:io/streams",
  "wasi:cli/stdout",
  "wasi:cli/stderr",
  "wasi:clocks/monotonic-clock",
  "wasi:random/random",
  "wasi:cli/environment"
]
filesystem = "read-only"
preopen    = "/workspace"
sockets    = "denied"
wall_clock = "denied"
env_allow  = []

[signatures]
cosign = "sha256:5c2d000000000000000000000000000000000000000000000000000000f347bb"
